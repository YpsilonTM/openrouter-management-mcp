[project]
name = "openrouter-management-mcp"
version = "2.0.0"
description = "MCP server for the OpenRouter Management API (keys, workspaces, guardrails, BYOK, org, observability, SCIM, analytics, …)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
keywords = ["mcp", "openrouter", "model-context-protocol"]
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
openrouter-management-mcp = "openrouter_management_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openrouter_management_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src/openrouter_management_mcp" = "openrouter_management_mcp"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
